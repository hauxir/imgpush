server {
    listen 5000;
    client_max_body_size 0;

    location / {
        proxy_pass http://unix:/app/imgpush.sock;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /nginx/ {
        internal;
        alias /;
        # nginx drops the app's response headers when it follows an
        # X-Accel-Redirect, the CORS ones included, so every image came back
        # without Access-Control-Allow-Origin and could not be read
        # cross-origin (a canvas or WebGL texture, a fetch). Put back what the
        # CORS middleware decided for this request; add_header skips an empty
        # value, so a request without an Origin gets nothing, as before.
        add_header Access-Control-Allow-Origin $upstream_http_access_control_allow_origin;
        add_header Vary $upstream_http_vary;
    }
}
