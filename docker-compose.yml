
services:
  imgpush:
    ports:
        - "5000:5000"
    build: .
    volumes:
      - imgpush-images:/images
      - imgpush-cache:/cache
    healthcheck:
      start_period: 0s
      test: ['CMD-SHELL', 'curl localhost:5000/liveness -s -f -o /dev/null || exit 1']
      interval: 30s
volumes:
  imgpush-images:
  imgpush-cache: